name: Temporary auth dependency validation

on:
  push:
    branches:
      - feat/github-app-user-access

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile and validate patched test toolchain
        run: |
          set -e
          npm install
          npm audit fix || true
          npm ci
          npx prisma generate
          npm run build
          npm test
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Commit validated lockfile and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/temp-auth-dependency-validation.yml
          git commit -m "fix: lock patched auth dependencies"
          git push origin HEAD:${{ github.ref_name }}
      - name: Remove temporary workflow after failed validation
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-auth-dependency-validation.yml || true
          git commit -m "chore: remove temporary auth validation workflow" || true
          git push origin HEAD:${{ github.ref_name }} || true

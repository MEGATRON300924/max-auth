name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/remove-runtime-prisma-migration

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lock and apply safe updates
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || echo "Some moderate advisories require separate dependency upgrades; retaining the safe lockfile updates."
          npm ci --ignore-scripts
      - name: Commit refreshed lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/refresh-lockfile.yml
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes were produced."
            exit 1
          fi
          git commit -m "chore: update vulnerable dependency resolutions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
